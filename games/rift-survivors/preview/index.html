.upgrade{min-height:96px;padding:10px}

// Reuse buckets and query buffers: bullets inspect only nearby enemy centers.
class EnemyGrid {
  constructor(size = 96) { this.size = size; this.cells = new Map(); this.active = []; }
  rebuild(enemies) {
    for (const bucket of this.active) bucket.length = 0;
    this.active.length = 0;
    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      const key = Math.floor(enemy.x / this.size) * 65536 + Math.floor(enemy.y / this.size);
      let bucket = this.cells.get(key);
      if (!bucket) { bucket = []; this.cells.set(key, bucket); }
      if (!bucket.length) this.active.push(bucket);
      bucket.push(enemy);
    }
  }
  move(enemy, oldX, oldY) {
    const oldKey = Math.floor(oldX / this.size) * 65536 + Math.floor(oldY / this.size);
    const key = Math.floor(enemy.x / this.size) * 65536 + Math.floor(enemy.y / this.size);
    if (key === oldKey) return;
    const oldBucket = this.cells.get(oldKey);
    const index = oldBucket?.indexOf(enemy) ?? -1;
    if (index < 0) return;
    oldBucket.splice(index, 1);
    let bucket = this.cells.get(key);
    if (!bucket) { bucket = []; this.cells.set(key, bucket); }
    if (!this.active.includes(bucket)) this.active.push(bucket);
    bucket.push(enemy);
  }
  query(minX, minY, maxX, maxY, out = []) {
    out.length = 0;
    for (let x = Math.floor(minX / this.size); x <= Math.floor(maxX / this.size); x++)
      for (let y = Math.floor(minY / this.size); y <= Math.floor(maxY / this.size); y++) {
        const bucket = this.cells.get(x * 65536 + y);
        if (bucket) for (const enemy of bucket) out.push(enemy);
      }
    return out;
  }
}


const STEP = 1 / 60;
class FixedClock {
  constructor() { this.accumulator = 0; this.dropped = 0; }
  reset() { this.accumulator = 0; }
  advance(delta, step, active = () => true) {
    if (!active()) { this.reset(); return 0; }
    const elapsed = Number.isFinite(delta) ? Math.max(0, delta) : 0;
    this.dropped += Math.max(0, elapsed - .15);
    this.accumulator += Math.min(elapsed, .15);
    let count = 0;
    while (this.accumulator + 1e-9 >= STEP && count < 9) {
      this.accumulator = Math.max(0, this.accumulator - STEP);
      step(STEP); count++;
      if (!active()) { this.reset(); break; }
    }
    return count;
  }
}
class RenderBudget {
  constructor(mode = "auto") { this.mode = mode; this.scale = 1; this.slow = 0; this.fast = 0; this.targetFPS = mode === "battery" ? 30 : 60; }
  set(mode) { this.mode = ["auto", "smooth", "battery"].includes(mode) ? mode : "auto"; this.scale = this.mode === "battery" ? .65 : 1; this.targetFPS = this.mode === "battery" ? 30 : 60; this.slow = this.fast = 0; }
  observe(ms) {
    if (this.mode !== "auto" || !Number.isFinite(ms) || ms <= 0 || ms > 120) return false;
    if (ms > 24) { this.slow++; this.fast = 0; } else if (ms < 19) { this.fast++; this.slow = Math.max(0, this.slow - 1); }
    if (this.slow >= 45 && (this.scale > .65 || this.targetFPS > 30)) { this.scale = Math.max(.65, this.scale - .2); this.targetFPS = this.scale <= .65 ? 30 : 60; this.slow = this.fast = 0; return true; }
    if (this.fast >= 240 && this.scale < 1) { this.scale = Math.min(1, this.scale + .2); this.targetFPS = 60; this.slow = this.fast = 0; return true; }
    return false;
  }
}
function joystick(pointerX, pointerY, originX, originY, radius = 43) {
  let dx = pointerX - originX, dy = pointerY - originY, distance = Math.hypot(dx, dy);
  if (distance > radius) { originX = pointerX - dx / distance * radius; originY = pointerY - dy / distance * radius; dx = pointerX - originX; dy = pointerY - originY; distance = radius; }
  const strength = distance < 4 ? 0 : Math.min(1, (distance - 4) / (radius - 4));
  return { originX, originY, x: distance ? dx / distance * strength : 0, y: distance ? dy / distance * strength : 0 };
}

}

function showSkillBook(){modal(heading("CLASS SKILLS",hero.name+"의 전투 기술","전용 공격 12종 · 다섯 지역에 걸쳐 성장")+'<div class="skill-codex">'+CLASS_SKILLS[hero.id].map(key=>{const u=UPGRADES[key],ev=EVOLUTIONS[key];return '<article><span class="glyph" style="color:'+u.color+'">'+iconMarkup(key)+'</span><div><strong>'+u.name+'</strong><p>'+u.desc+'</p><small>'+(STAGE_SKILLS[key]?STAGE_SKILLS[key].stage+'스테이지 진입 시 획득<br>':'1스테이지부터 선택 가능<br>')+'Lv.3: '+SKILL_STAGES[key][0]+'<br>Lv.5: '+SKILL_STAGES[key][1]+'<br>최종 진화: Lv.5 + '+UPGRADES[ev.passive].name+' Lv.2 → '+ev.name+'</small><button class="codex-practice" data-practice="'+key+'">15초 연습</button></div></article>';}).join("")+'</div><p class="tip">성장 룬 8종: 피해 · 공격 속도 · 이동 · 체력 · 수집 · 치명타 · 흡혈 · 영역 확장<br>레벨업할 때 네 가지 선택이 나오고, 빈 공격 칸이 있으면 새 공격을 보여주고, 기존 공격 강화와 성장 룬도 함께 고를 수 있어요. Lv.6에 5칸, Lv.10에 6칸. 2~5스테이지마다 새 전용 공격과 슬롯 하나를 추가해 최대 10종을 함께 써요.</p><button id="skill-book-close" class="primary">확인</button>',"skill-book");$("skill-book-close").onclick=hideModal;for(const b of document.querySelectorAll("[data-practice]"))b.onclick=()=>{location.href="?v="+GAME_VERSION+"&practice="+encodeURIComponent(b.dataset.practice);};}

function showHelp(){modal(heading("HOW TO PLAY","다섯 지역의 군주를 쓰러뜨리세요","복잡한 조작 없이 이동과 선택에 집중하세요.")+'<div class="help-step"><b>1</b><p>전장 아무 곳이나 드래그해 이동해요. 공격은 자동으로 나가요.</p></div><div class="help-step"><b>2</b><p>초록 경험치를 모아요. 레벨이 오르면 새 공격이나 강화를 선택해요. Lv.6과 Lv.10에 공격 칸이 늘어나요. 무기는 Lv.3과 Lv.5에서 공격 방식이 변해요. Lv.5와 연결 룬 Lv.2를 모으면 최종 진화해요.</p></div><div class="help-step"><b>3</b><p>회피로 위험에서 벗어나세요. 기사·궁수·마법사는 서로 다른 필살기를 사용해요.</p></div><div class="help-step"><b>4</b><p>보라색 균열 안에 3초 머물러 봉인하면 경험치·회복·필살기 재충전을 얻어요. 1스테이지는 5분, 다음 지역은 2분 30초~3분 뒤 보스가 출현해요. 군주 처치 후 다음 지역으로 이동하고 5지역을 모두 깨면 승리해요.</p></div><p class="tip">PC: WASD/방향키 이동 · Space 회피 · E 궁극기 · Esc 일시정지</p><button id="help-close" class="primary">알겠어요</button>',"help");$("help-close").onclick=hideModal;}
function showPrivacy(){modal(heading("GAME INFORMATION","게임과 데이터 안내","균열의 수호자 · 버전 "+GAME_VERSION+"")+'<div class="privacy"><h3>어떤 게임인가요?</h3><p>세 영웅의 스킬을 조합해 별빛 유적을 지키는 2D 생존 액션이에요. 손그림풍 캐릭터와 유적 배경, 금빛 룬 참격과 녹음 효과음으로 전투를 표현해요.</p><h3>어떤 정보를 저장하나요?</h3><p>토스 익명 식별키를 이용해 이 기기에 점수, 보석, 강화와 설정을 저장해요. 이름, 연락처, 위치는 요청하지 않으며 별도 서버로 전송하지 않아요.</p><h3>기록은 어디에 남나요?</h3><p>기기 안의 토스 저장소에 남아요. 기기를 바꾸거나 미니앱 데이터를 삭제하면 기록이 이어지지 않을 수 있어요.</p><h3>제작 크레딧</h3><p>휘두름: artisticdude · RPG Audio: Kenney (CC0). 판타지 효과음: <a href="https://littlerobotsoundfactory.com" target="_blank" rel="noopener">Little Robot Sound Factory</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>. 금속 마찰: The Berklee College of Music (qubodup 제공), CC BY 3.0. 천둥: <a href="https://www.jshaw.co.uk" target="_blank" rel="noopener">InspectorJ</a>, CC BY 3.0. 화염: qubodup, 바위 붕괴: Blender Foundation, 바람: Flixberry Entertainment, 독 기포: spookymodem (CC BY 3.0). 얼음: IgnasD, 폭발 녹음: rubberduck (CC0). 자르기·필터·음량 조정·레이어링으로 편집했어요. <a href="audio/CREDITS.txt" target="_blank" rel="noopener">전체 음원 출처와 변경 내용</a>. 제목 글꼴: Noto Serif KR (SIL OFL).</p><h3>문의하기</h3><p>토스 우측 상단 더보기의 문의하기를 이용해 주세요.</p></div><button id="privacy-close" class="primary">닫기</button>',"privacy");$("privacy-close").onclick=hideModal;}
function requestExit(){if(!ready)return;const active=game&&!game.result,before=game?.phase;if(game?.phase==="playing")game.pause();resetInput();audio.stop();platform.awake(false);modal(heading("LEAVE THE RIFT","미니앱을 종료할까요?",active?"이번 도전은 종료돼요. 지금까지 획득한 보상을 저장한 뒤 나가요.":"점수, 보석과 강화는 이 기기에 저장돼요.")+'<button id="exit-cancel" class="primary">계속 머무르기</button><button id="exit-confirm" class="secondary">저장하고 종료</button>',"exit");$("exit-cancel").onclick=()=>{hideModal();if(game){if(before==="stage-clear")showStageClear();else if(before==="upgrade")showUpgrade();else if(game.result)showResult();else showPause();}else audio.unlock();};
$("exit-confirm").onclick=async()=>{const b=$("exit-confirm");b.disabled=true;b.textContent="기록을 저장하고 있어요";exiting=true;try{if(game&&!game.result)game.finish(false);settleRun();await persist();const closed=await platform.close();if(!closed)showHome();}catch{exiting=false;b.disabled=false;b.textContent="저장하고 종료";toast("저장을 완료하지 못했어요. 다시 시도해 주세요.");}};}
function updateHud(){if(!game)return;const p=game.player;$("hptext").textContent=Math.ceil(p.hp)+" / "+p.maxHp;$("hpbar").style.width=(p.hp/p.maxHp*100)+"%";$("level").textContent="Lv. "+game.level;$("xpbar").style.width=(game.xp/game.need*100)+"%";$("time").textContent=timeText(game.time);$("kills").textContent=format(game.kills);$("objective").textContent=game.practice?"15초 "+practiceTitle:game.bossSpawned?game.stageConfig.boss+" 처치":timeText(Math.max(0,game.stageConfig.duration-game.stageTime))+" 후 보스";
$("chapter").textContent=game.practice?"TRAINING":game.stage+" / 5 · "+game.stageConfig.name;
$("run-progress").style.width=Math.min(100,((game.stage-1)+Math.min(1,game.stageTime/game.stageConfig.duration))/5*100)+"%";const r=game.rift;$("encounter").classList.toggle("hidden",!r);if(r){$("rift-progress").style.width=r.progress/3*100+"%";$("rift-status").textContent=r.progress>0?"봉인 "+Math.floor(r.progress/3*100)+"%":"균열 안에 3초 머물기";$("rift-time").textContent=Math.ceil(r.life)+"초";}const boss=game.enemies.find(e=>e.boss);$("bossbar").classList.toggle("hidden",!boss);if(boss){$("bossfill").style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";$("bossbar").querySelector("span").textContent=game.stageConfig.boss;}
for(const [id,cd]of [["dash",p.dashCd],["ultimate",p.ultCd]]){const b=$(id);b.querySelector("b").textContent=cd>0?String(Math.ceil(cd)):"";b.style.setProperty("--cool",String(Math.max(0,Math.min(1,cd/ABILITY_COOLDOWNS[id]))));b.classList.toggle("ready",cd<=0);b.disabled=cd>0||game.phase!=="playing";}const sig=JSON.stringify([game.weapons,game.evolved]);if(sig!==skillSignature){skillSignature=sig;$("skills").innerHTML=Object.entries(game.weapons).map(([k,lv])=>'<span class="skill" style="color:'+UPGRADES[k].color+'" aria-label="'+(game.evolved[k]?EVOLUTIONS[k].name:UPGRADES[k].name)+' '+lv+'레벨">'+iconMarkup(k)+'<small>'+(game.evolved[k]?'✦':lv)+'</small></span>').join("");}}
function movementInput(){if(joy.active)return {x:joy.x,y:joy.y};return {x:(keys.has("d")||keys.has("arrowright")?1:0)-(keys.has("a")||keys.has("arrowleft")?1:0),y:(keys.has("s")||keys.has("arrowdown")?1:0)-(keys.has("w")||keys.has("arrowup")?1:0)};}
function triggerDash(){const {x,y}=movementInput();return game?.dash(x,y);}
function frame(ts){
const elapsed=last?Math.max(0,(ts-last)/1000):0;last=ts;clock=ts/1000;metrics.frameMs=elapsed*1000;
if(document.hidden){simulation.reset();requestAnimationFrame(frame);return;}
if(game?.phase==="playing"&&budget.observe(elapsed*1000))renderer.setQuality(budget.scale);
const begun=performance.now();
if(game){const {x,y}=movementInput();joy.keyboard=!!(x||y)&&!joy.active;
metrics.steps+=simulation.advance(elapsed,dt=>game.step(dt,{x,y}),()=>game?.phase==="playing");
for(const e of game.events.splice(0)){audio.event(e.type,e.key,e);renderer.react(e,game);if(e.type==="ultimate")banner("궁극기 · "+e.name,1.5);if(e.type==="reinforcements")banner("군주의 지원군 · 포위를 벗어나세요",2);if(e.type==="rift-open")banner("균열 개방 · 원 안에 3초 머물기",2);if(e.type==="rift-sealed")banner("봉인 완료 · 회복 + 필살기 재충전",2.3);if(e.type==="chapter")banner(["","날개 군단이 몰려옵니다","뒤틀린 수호자의 습격","저주의 기운이 짙어집니다","마지막 저항 · 군주를 준비하세요"][e.chapter],2.2);if(e.type==="boss")banner(e.name+" 출현 · "+e.stage+"/5",3);if(e.type==="elite")banner("강력한 적이 나타났어요",2);if(e.type==="awaken")banner(e.name+" · Lv."+e.level+" 각성",2.5);if(e.type==="evolve")banner(e.name+" · 진화!",2.5);if(e.type==="chest")banner("정예 보상 · 경험치와 회복",1.8);if(e.type==="magnet")banner("모든 경험치를 끌어당겨요",1.8);if(e.type==="supply")banner("푸른 인력 상자가 나타났어요",1.8);}
if(!exiting){if(game.phase==="stage-clear"&&dialogKind!=="stage-clear"&&dialogKind!=="exit")showStageClear();if(game.phase==="upgrade"&&dialogKind!=="upgrade"&&dialogKind!=="exit")showUpgrade();if(game.phase==="result"&&dialogKind!=="result"&&dialogKind!=="exit")showResult();}
if(ts-lastHud>=100){updateHud();lastHud=ts;}
}else simulation.reset();
metrics.updateMs=performance.now()-begun;
if(bannerUntil&&clock>bannerUntil){$("banner").style.opacity="0";bannerUntil=0;}
const fps=game?.phase==="playing"?budget.targetFPS:30;
if(ts-lastDraw>=1000/fps-1){const drawStart=performance.now();renderer.draw(clock,game,hero,joy);metrics.renderMs=performance.now()-drawStart;metrics.frames++;lastDraw=ts;}
requestAnimationFrame(frame);
}

const world=$("world"),touchInput="TouchEvent" in window;
function beginMovement(source,id,x,y){if(game?.phase!=="playing"||!joy.begin(source,id,x,y,world.getBoundingClientRect()))return false;keys.clear();joy.keyboard=false;$("move-hint").textContent="";audio.unlock();return true;}
function moveMovement(source,id,x,y){return joy.move(source,id,x,y,world.getBoundingClientRect());}
function endMovement(source,id){if(joy.end(source,id))keys.clear();}
world.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&touchInput)return;if(beginMovement("pointer",e.pointerId,e.clientX,e.clientY)){if(e.cancelable)e.preventDefault();try{world.setPointerCapture(e.pointerId);}catch{}}});
window.addEventListener("pointermove",e=>moveMovement("pointer",e.pointerId,e.clientX,e.clientY));
for(const type of ["pointerup","pointercancel"])window.addEventListener(type,e=>endMovement("pointer",e.pointerId));
world.addEventListener("lostpointercapture",e=>endMovement("pointer",e.pointerId));
// Phones use the owning touch identifier; other fingers and compatibility pointer events cannot steal movement.
world.addEventListener("touchstart",e=>{const t=e.changedTouches[0];if(t&&beginMovement("touch",t.identifier,t.clientX,t.clientY)&&e.cancelable)e.preventDefault();},{passive:false});
window.addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(moveMovement("touch",t.identifier,t.clientX,t.clientY)){if(e.cancelable)e.preventDefault();break;}},{passive:false});
for(const type of ["touchend","touchcancel"])window.addEventListener(type,e=>{for(const t of e.changedTouches)endMovement("touch",t.identifier);});
$("world").addEventListener("contextmenu",e=>e.preventDefault());const actions={dash:triggerDash,ultimate:()=>game?.ultimate()};for(const [id,action]of Object.entries(actions)){$(id).onclick=action;$(id).addEventListener("pointerdown",e=>{if(e.pointerType==="touch"){e.preventDefault();audio.unlock();action();}});}$("pause").onclick=showPause;$("start").onclick=startGame;$("settings").onclick=()=>{audio.unlock();showSettings(false);};$("forge").onclick=showForge;$("help").onclick=showHelp;$("skill-book").onclick=showSkillBook;$("privacy").onclick=showPrivacy;
document.addEventListener("keydown",e=>{if(dialogKind){if(e.key==="Tab"){const buttons=[...$("dialog").querySelectorAll("button:not(:disabled)")];if(!buttons.length){e.preventDefault();return;}const first=buttons[0],end=buttons.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$("dialog"))){end.focus();e.preventDefault();}else if(!e.shiftKey&&(document.activeElement===end||document.activeElement===$("dialog"))){first.focus();e.preventDefault();}}if(e.key==="Escape"&&["help","forge","privacy","settings","skill-book"].includes(dialogKind)){e.preventDefault();if(game)showPause();else hideModal();}return;}
if(game?.phase!=="playing")return;const k=e.key.toLowerCase();if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," ","e","escape"].includes(k))e.preventDefault();keys.add(k);if(!e.repeat){if(k===" ")triggerDash();if(k==="e")game.ultimate();if(k==="escape")showPause();}});
document.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function background(){simulation.reset();last=0;resetInput();audio.stop();platform.awake(false);if(game?.phase==="playing")showPause();}
document.addEventListener("visibilitychange",()=>{if(document.hidden)background();});window.addEventListener("pagehide",()=>{background();});window.addEventListener("pageshow",()=>{last=0;simulation.reset();renderer.resize();});window.addEventListener("blur",()=>{keys.clear();joy.keyboard=false;if(document.hidden&&game?.phase==="playing")background();});window.addEventListener("resize",()=>{renderer.resize();if(game){if(!game.practice)game.spawnDistance=Math.max(330,Math.min(430,renderer.h*.46));if(joy.active)joy.rebase(world.getBoundingClientRect());}});
async function boot(){$("retry").hidden=true;$("boot-message").textContent="모험을 준비하고 있어요";try{const loaded=await Promise.all([platform.init(requestExit),Art.load(),audio.prepare()]);save=loaded[0];renderer.makeGround();renderer.resize();renderer.reduced=save.settings.reduced||window.matchMedia("(prefers-reduced-motion: reduce)").matches;audio.enabled=save.settings.sound;budget.set(save.settings.performance);renderer.setQuality(budget.scale);ready=true;renderHeroes();$("boot").classList.add("hidden");showHome();if(practiceHero){$("start").firstChild.textContent=practiceTitle+" 시작 ";$("hero-description").textContent=hero.name+"의 움직임과 타격을 15초 동안 연습해요";}}catch{ready=false;$("boot-message").textContent="게임을 불러오지 못했어요. 연결을 확인하고 다시 시도해 주세요.";$("retry").hidden=false;}}
$("retry").onclick=boot;
for(const [id,key]of [["dash","dash"],["ultimate","ultimate"]])$(id).querySelector("span").innerHTML=iconMarkup(key);$("settings").innerHTML=iconMarkup("settings");$("pause").innerHTML=iconMarkup("pause");
requestAnimationFrame(frame);boot();

</script></body></html>
