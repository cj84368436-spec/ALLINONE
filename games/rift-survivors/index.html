<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a182d"><title>균열의 수호자</title><link rel="icon" type="image/svg+xml" href="./icon.svg"></head><body data-build="5.1.0-production"><div id="app">
<canvas id="world" aria-label="균열 전장"></canvas>
<div id="boot" class="screen"><div class="boot-rune">✦</div><h1>균열의 수호자</h1><p id="boot-message">모험을 준비하고 있어요</p><button id="retry" class="primary" hidden>다시 연결하기</button></div>
<section id="home" class="screen hidden"><header class="home-top"><span class="wordmark">RIFT KEEPERS</span><button id="settings" class="icon-button" aria-label="설정">⚙</button></header>
<div class="home-title"><div class="eyebrow">별빛 유적의 마지막 수호자</div><h1>균열의 <span>수호자</span></h1><p>한 번의 선택으로, 전투가 달라진다.</p></div>
<div class="home-content"><div class="row"><h2>함께할 영웅</h2><span class="coin">◈ <b id="coins">0</b></span></div><div id="heroes" class="heroes" role="group" aria-label="영웅 선택"></div><p id="hero-description" class="hero-description"></p><button id="start" class="primary start">균열에 들어가기 <span>→</span></button><div class="home-actions"><button id="forge" class="secondary">✦ 영구 강화</button><button id="skill-book" class="secondary">직업 스킬</button><button id="help" class="secondary">플레이 방법</button></div><div class="record"><span>최고 점수 <b id="best">0</b></span><span>균열 정복 <b id="wins">0</b>회</span></div><button id="privacy" class="text-button">게임 정보 · 데이터 안내</button></div></section>
<section id="hud" class="hidden" aria-label="게임 상태"><div class="hud-top"><div class="hp-group"><span>♥ <b id="hptext"></b></span><div class="bar hp"><i id="hpbar"></i></div></div><button id="pause" class="icon-button" aria-label="일시정지">Ⅱ</button></div><div class="xp-line"><span id="level">Lv. 1</span><div class="bar xp"><i id="xpbar"></i></div></div><div class="run-timeline"><i id="run-progress"></i></div><div class="chapter-label" id="chapter">01 · 별빛 유적</div><div class="hud-info"><span id="time">00:00</span><span id="objective">05:00까지 생존</span><span>처치 <b id="kills">0</b></span></div><div id="encounter" class="encounter hidden"><span class="encounter-mark">◇</span><div><strong id="rift-status">균열 안에 3초 머물기</strong><small>회복 · 경험치 · 필살기 재충전</small><div class="rift-track"><i id="rift-progress"></i></div></div><b id="rift-time">18초</b></div><div id="bossbar" class="hidden"><span>균열의 군주</span><div class="bar boss"><i id="bossfill"></i></div></div><div id="banner" aria-live="polite"></div><div class="bottom-hud"><div id="skills"></div><span id="move-hint">화면을 드래그해 이동</span></div><div class="abilities"><button id="dash" class="ability" aria-label="회피"><span>»</span><small>회피</small><b></b></button><button id="ultimate" class="ability ultimate" aria-label="궁극기"><span>✦</span><small>별빛 폭풍</small><b></b></button></div></section>
<div id="overlay" class="hidden"><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section></div><div id="toast" role="status" aria-live="polite"></div></div><script type="module" src="/src/main.js"></script></body></html>
