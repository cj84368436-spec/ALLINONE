name: Capture and verify three animated heroes 1.5
on:
  push:
    paths:
      - '.github/workflows/rift-heroes.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rift-heroes
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image preparation tools
        working-directory: games/rift-survivors
        run: npm install --no-save --no-audit --no-fund sharp@0.34.5
      - name: Capture actual mobile game screens
        working-directory: games/rift-survivors
        run: |
          npx playwright install --with-deps chromium
          node scripts/capture-art.mjs
      - name: Save review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .evidence/rift-1.5/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture all three heroes in mobile combat 1.5 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: rift-heroes-review
          path: .evidence/rift-1.5/
