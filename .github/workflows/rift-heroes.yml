name: Prepare ranger and mage assets 1.5
on:
  push:
    paths:
      - '.github/workflows/rift-heroes.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rift-heroes
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce compact animation frames and recorded audio
        working-directory: games/rift-survivors
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          npm install --no-save --no-audit --no-fund sharp@0.34.5
          node scripts/prepare-heroes.mjs
      - name: Save generated production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rift-survivors/public/art/ games/rift-survivors/public/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare ranger and mage frames and recorded ranged audio [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: rift-ranged-production-assets
          path: |
            games/rift-survivors/public/art/
            games/rift-survivors/public/audio/
