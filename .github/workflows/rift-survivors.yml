name: Rift Survivors - Toss miniapp
on:
  push:
    paths:
      - 'games/rift-survivors/**'
      - '.github/workflows/rift-survivors.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Apps in Toss console appName'
        required: false
        default: 'rift-keepers'
      upload_to_toss:
        description: 'Upload verified TEST bundle to Toss (requires TOSS_API_KEY secret)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: rift-survivors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/rift-survivors
    env:
      TOSS_APP_NAME: ${{ inputs.app_name || vars.TOSS_APP_NAME || 'rift-keepers' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt > /dev/null
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture actual mobile art review
        run: |
          npm install --prefix /tmp/rift-review sharp --no-audit --no-fund
          node scripts/design-review.mjs
      - name: Store reviewable screenshots
        working-directory: .
        run: |
          git config user.name "Rift visual verification"
          git config user.email "actions@users.noreply.github.com"
          git add .evidence/rift-3.0
          git diff --cached --quiet && exit 0
          git commit -m "Store verified Rift 3.0 visual review [skip ci]"
          git pull --rebase
          git push
      - run: npm run test:e2e
      - run: npm run playthrough
      - run: npm run benchmark
      - run: npm run build
      - run: npm run check:release
      - run: npm run screenshots
      - name: Optional Toss console TEST upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_toss }}
        env:
          TOSS_API_KEY: ${{ secrets.TOSS_API_KEY }}
        run: node scripts/deploy-toss.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rift-keepers-toss-release
          path: |
            games/rift-survivors/*.ait
            games/rift-survivors/dist/
            games/rift-survivors/docs/
            games/rift-survivors/public/
            games/rift-survivors/package-lock.json
            games/rift-survivors/release/
            games/rift-survivors/README.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-keepers-test-evidence
          path: |
            games/rift-survivors/playwright-report/
            games/rift-survivors/test-results/
          if-no-files-found: ignore
