name: Rift V5 campaign artwork
on:
  push:
    paths: ['games/rift-survivors/.asset-tools/v5/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/rift-v5-assets sharp --no-audit --no-fund
      - run: node games/rift-survivors/.asset-tools/v5/prepare.mjs
      - run: |
          git config user.name "Rift campaign artwork"
          git config user.email "actions@users.noreply.github.com"
          git add games/rift-survivors/public/art
          git commit -m "Prepare 12 original campaign sprites [skip ci]"
          git pull --rebase
          git push
