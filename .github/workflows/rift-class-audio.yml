name: Rift class audio remix
on:
  push:
    paths:
      - '.asset-tools/remix-rift-class-audio.mjs'
      - '.github/workflows/rift-class-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Foley and recorded thunder
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node .asset-tools/remix-rift-class-audio.mjs
      - name: Commit credited remixed samples
        run: |
          git config user.name "Rift audio preparation"
          git config user.email "actions@users.noreply.github.com"
          git add games/rift-survivors/public/audio .evidence/rift-2.1/audio
          git diff --cached --quiet && exit 0
          git commit -m "Remix steel sword Foley and recorded thunder for class skills [skip ci]"
          git pull --rebase
          git push
