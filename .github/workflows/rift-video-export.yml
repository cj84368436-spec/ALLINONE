name: Export recorded sword review video
on:
  push:
    paths:
      - '.github/workflows/rift-video-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export transferable video chunks
        run: |
          mkdir -p .evidence/rift-1.4/video-export
          base64 -w 0 .evidence/rift-1.4/knight-15s.mp4 | split -b 600000 -d - .evidence/rift-1.4/video-export/part-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .evidence/rift-1.4/video-export/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Export recorded combat video for same-origin playback [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
