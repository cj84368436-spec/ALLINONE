name: Rift arrow flight Foley
on:
  push:
    paths:
      - '.asset-tools/remix-rift-arrow-flight.mjs'
      - '.github/workflows/rift-arrow-flight.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare recorded aerodynamic arrow flight
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node .asset-tools/remix-rift-arrow-flight.mjs
      - name: Store credited sample and waveform evidence
        run: |
          git config user.name "Rift audio preparation"
          git config user.email "actions@users.noreply.github.com"
          git add games/rift-survivors/public/audio .evidence/rift-3.1/audio
          git diff --cached --quiet && exit 0
          git commit -m "Add recorded airy arrow flight with source and waveform evidence [skip ci]"
          git pull --rebase
          git push
