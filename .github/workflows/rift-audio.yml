name: Prepare recorded game audio
on:
  push:
    paths:
      - '.github/workflows/rift-audio.yml'
      - 'games/rift-survivors/scripts/prepare-audio.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rift-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio encoder
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Prepare licensed recorded effects
        working-directory: games/rift-survivors
        run: node scripts/prepare-audio.mjs
      - name: Save bundled audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rift-survivors/public/audio/ .evidence/rift-1.3/sword-demo.wav
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare licensed recorded sound assets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
