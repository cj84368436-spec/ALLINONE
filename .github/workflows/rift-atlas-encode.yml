name: Optimize Rift production atlases
on:
  push:
    paths:
      - '.asset-tools/encode-rift-atlases.mjs'
      - '.github/workflows/rift-atlas-encode.yml'
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/rift-assets sharp --no-audit --no-fund
      - run: node .asset-tools/encode-rift-atlases.mjs
      - name: Commit encoded atlases and technical metadata
        run: |
          git config user.name "Rift art preparation"
          git config user.email "actions@users.noreply.github.com"
          git add games/rift-survivors/public/art .evidence/rift-3.0/masters
          git diff --cached --quiet && exit 0
          git commit -m "Encode original ability and VFX atlases for mobile delivery [skip ci]"
          git pull --rebase
          git push
